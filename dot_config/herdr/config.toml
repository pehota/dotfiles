onboarding = false
[theme]
name = "gruvbox"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
status_indicators = "symbols"
[terminal]
new_cwd = "follow"


[keys]
prefix = "alt+e"
split_vertical = "prefix+|"
split_horizontal = "prefix+-"
zoom = "alt+="
previous_agent = "prefix+shift+tab"
switch_workspace = "prefix+1..9"
switch_tab = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

[ui.toast]
delivery = "system"

[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    { token = "$load" },
    { token = "terminal_title_stripped", dim = false, fg = "#D9D2B9" },
  ],
  [
    { token = "workspace", dim = true, bold = false },
  ],
  [
    { token = "agent", dim = true },
  ],
]
row_gap = 1
